name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck
        continue-on-error: false

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_PESASWAP_PUBLISHABLE_KEY: ${{ secrets.VITE_PESASWAP_PUBLISHABLE_KEY }}

  deploy:
    name: Deploy to Cloudflare
    needs: quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_PESASWAP_PUBLISHABLE_KEY: ${{ secrets.VITE_PESASWAP_PUBLISHABLE_KEY }}

      - name: Deploy to Cloudflare Workers
        # Only deploys when the Cloudflare secrets are configured; otherwise the
        # step is skipped and the job stays green (deploys automatically once the
        # CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repo secrets are added).
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}

  e2e:
    name: E2E (PWA → back office)
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pesaswap
          POSTGRES_PASSWORD: pesaswap
          POSTGRES_DB: pesaswap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pesaswap"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://pesaswap:pesaswap@localhost:5432/pesaswap
      CI: "true"
      # Use 127.0.0.1 (not localhost) so wait-on + the tests hit the IPv4 the
      # dev server binds to — Node resolves "localhost" to IPv6 ::1 first, where
      # the server isn't listening.
      E2E_BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply database migrations
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          for f in db/*.sql; do
            echo "Applying $f"
            PGPASSWORD=pesaswap psql -h localhost -U pesaswap -d pesaswap -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start the app
        run: |
          npm run dev -- --host 0.0.0.0 --port 8080 > dev-server.log 2>&1 &
          npx --yes wait-on http://127.0.0.1:8080/api/health --timeout 180000 --interval 1000 || {
            echo "=== dev-server.log ==="; cat dev-server.log || true;
            echo "=== curl /api/health ==="; curl -sv http://127.0.0.1:8080/api/health || true;
            exit 1;
          }

      - name: E2E — HTTP flows (PWA → back office)
        run: npm run test:e2e

      - name: E2E — browser UI
        run: npm run test:e2e:browser

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            dev-server.log
            playwright-report/
            test-results/
          if-no-files-found: ignore
