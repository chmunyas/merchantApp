name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck
        continue-on-error: false

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_PESASWAP_PUBLISHABLE_KEY: ${{ secrets.VITE_PESASWAP_PUBLISHABLE_KEY }}

  deploy:
    name: Deploy to Cloudflare
    needs: quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DEPLOY_ENABLED: ${{ secrets.CLOUDFLARE_DEPLOY_ENABLED }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_PESASWAP_PUBLISHABLE_KEY: ${{ secrets.VITE_PESASWAP_PUBLISHABLE_KEY }}

      - name: Deploy to Cloudflare Workers
        # Deploys only when the Cloudflare secrets are set AND deploys are
        # explicitly enabled (CLOUDFLARE_DEPLOY_ENABLED == 'true'). This keeps CI
        # green until a real deploy is actually viable, which additionally needs:
        #   1. a token with Workers Scripts:Edit + Hyperdrive:Edit on the account,
        #   2. a provisioned Hyperdrive id in wrangler.toml (currently a
        #      placeholder) pointing at a PUBLICLY reachable Postgres — the app DB
        #      is local, so an edge Worker cannot reach it as-is.
        # Once those are in place, add the CLOUDFLARE_DEPLOY_ENABLED=true secret.
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}

  e2e:
    name: E2E (PWA → back office)
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pesaswap
          POSTGRES_PASSWORD: pesaswap
          POSTGRES_DB: pesaswap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pesaswap"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://pesaswap:pesaswap@localhost:5432/pesaswap
      CI: "true"
      # Use 127.0.0.1 (not localhost) so the health poll + the tests hit the IPv4
      # the dev server binds to — Node resolves "localhost" to IPv6 ::1 first,
      # where the server isn't listening.
      E2E_BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply database migrations
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          for f in db/*.sql; do
            echo "Applying $f"
            PGPASSWORD=pesaswap psql -h localhost -U pesaswap -d pesaswap -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start the app
        run: |
          npm run dev -- --host 0.0.0.0 --port 8080 > dev-server.log 2>&1 &
          echo "Waiting for dev server at http://127.0.0.1:8080/api/health ..."
          # Poll with curl instead of wait-on: the first request compiles the
          # SSR route on demand, and curl reliably waits for a real 2xx where
          # wait-on's probe semantics did not. Up to ~300s (100 x 3s).
          ok=""
          for i in $(seq 1 100); do
            if curl -sf --max-time 30 http://127.0.0.1:8080/api/health > health.json 2>/dev/null; then
              echo "Server healthy after ~$((i * 3))s: $(cat health.json)"
              ok="1"
              break
            fi
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "=== dev server never became healthy ==="
            echo "=== dev-server.log ==="; cat dev-server.log || true
            echo "=== final curl (verbose) ==="; curl -sv --max-time 30 http://127.0.0.1:8080/api/health || true
            exit 1
          fi

      - name: E2E — HTTP flows (PWA → back office)
        run: npm run test:e2e

      - name: E2E — browser UI
        run: npm run test:e2e:browser

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            dev-server.log
            playwright-report/
            test-results/
          if-no-files-found: ignore
