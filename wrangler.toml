#:schema node_modules/wrangler/config-schema.json
name = "pesaswap-merchant-app"
main = "dist/server/server.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/client"

[vars]
# API base for server->PesaSwap calls (src/api/payments.ts). Production is live;
# NOT app.pesaswap.io (dashboard). Use https://api.sandbox.pesaswap.io for tests.
PESASWAP_URL = "https://api.pesaswap.io"

# PesaSwap business profile id — required on every /payments call (server-side
# M-Pesa STK). From the merchant account (GET /payments shows it on any payment).
PESASWAP_PROFILE_ID = "pro_4TgkuteoiYO8M9hvtNCa"

# Auth posture (config-as-code so it is version-controlled, not a floating
# secret). "0"/unset = open, scoped, NON-admin pilot session — demo login works
# and the back office can call protected endpoints. Set to "1" to force a real
# credentialed login (email+password / Google / staff PIN) for every operator.
# Kept "0" for the live pilot; flip to "1" here and redeploy to harden.
AUTH_REQUIRE_LOGIN = "0"

# Public origin for shareable links (pay links, QR, booking). Without this,
# links fall back to http://localhost:8080 and break for real customers/agents.
PUBLIC_BASE_URL = "https://pesaswap-merchant-app.pesaswap.workers.dev"

# Lock browser cross-origin access to the app's own origin (leave unset in dev to
# keep "*"). Same-origin requests are unaffected; this blocks unknown web origins.
CORS_ALLOWED_ORIGIN = "https://pesaswap-merchant-app.pesaswap.workers.dev"

# Payments test mode. "1" simulates a SUCCESSFUL payment WITHOUT calling PesaSwap,
# so the full journey (QR -> order -> pay -> success -> loyalty -> receipt portal)
# can be tested end-to-end without live credentials. The ledger is still written
# (loyalty + settlement run). Set to "0" and add a real PESASWAP_API_KEY (secret)
# to take real M-Pesa payments.
PAYMENTS_TEST_MODE = "0"

# --- Cloudflare edge capabilities ---

# Workers AI: the natural-language ops agent + embeddings for pgvector memory.
# Enable for a real deploy. Workers AI runs on Cloudflare, so it is NOT available
# in offline `wrangler dev` — the agent falls back to rule-based SQL locally:
#   [ai]
#   binding = "AI"

# Hyperdrive: pooled, low-latency access to the PostgreSQL database from the
# edge. Postgres is the single source of truth. Provision with:
#   wrangler hyperdrive create pesaswap-db --connection-string="postgres://USER:PASS@HOST:5432/DB"
# then paste the returned id below. `wrangler dev` uses localConnectionString
# (override per-container with WRANGLER_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "37e129fb323e48f8b30c842852bfddd7"
localConnectionString = "postgres://pesaswap:pesaswap@localhost:5433/pesaswap"

# Real-time hub. A Durable Object is the only way to fan an event (e.g. a payment
# webhook) out to a merchant's live WebSocket across isolates; module globals are
# per-isolate. One instance per merchant (idFromName). The polling fallback reads
# the same DO's durable buffer, so both transports are correct.
[[durable_objects.bindings]]
name = "REALTIME"
class_name = "RealtimeHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeHub"]

# Secrets (set via `wrangler secret put`):
# - PESASWAP_API_KEY
# - PESASWAP_WEBHOOK_SECRET
# - WHATSAPP_BRIDGE_URL    (public Cloudflare-Tunnel URL of the local WhatsApp
#                           bridge, so the edge Worker can send via WhatsApp)
# - WHATSAPP_BRIDGE_TOKEN  (shared secret guarding the bridge; must match the
#                           bridge container's BRIDGE_TOKEN)
# - CRON_SECRET            (shared secret guarding the invoicing/run +
#                           sequences/run sweeps against anonymous callers)

# ===========================================================================
# Sandbox environment — a SEPARATE Worker (its own URL + its own database) that
# SIMULATES payments, so the whole journey (QR -> order -> pay -> success ->
# receipt) can be tried with no real money and no live PesaSwap key. Deploy with:
#   npx wrangler deploy --env sandbox
# Production (live M-Pesa) stays the DEFAULT top-level deploy: `wrangler deploy`.
# Named environments do NOT inherit [vars]/bindings, so they are redeclared here.
# ===========================================================================
[env.sandbox]
name = "pesaswap-merchant-app-sandbox"

[env.sandbox.vars]
# Point server->PesaSwap calls at the sandbox host (unused while TEST_MODE=1).
PESASWAP_URL = "https://api.sandbox.pesaswap.io"
PESASWAP_PROFILE_ID = "pro_4TgkuteoiYO8M9hvtNCa"
AUTH_REQUIRE_LOGIN = "0"
# Shareable links + CORS resolve to the sandbox origin, not production.
PUBLIC_BASE_URL = "https://pesaswap-merchant-app-sandbox.pesaswap.workers.dev"
CORS_ALLOWED_ORIGIN = "https://pesaswap-merchant-app-sandbox.pesaswap.workers.dev"
# Simulate a SUCCESSFUL payment without calling PesaSwap — no real money moves
# and no live API key is required. The ledger + settlement still run, so the full
# flow is exercised end-to-end. This is what makes it a true sandbox.
PAYMENTS_TEST_MODE = "1"
SENTRY_ENVIRONMENT = "sandbox"

# Sandbox database — a SEPARATE Neon database (pesaswap_sandbox) so test data
# never mixes with production. Provisioned via:
#   wrangler hyperdrive create pesaswap-db-sandbox --connection-string="<sandbox>"
[[env.sandbox.hyperdrive]]
binding = "HYPERDRIVE"
id = "f9c735c4224f4ca6b40c1ad61aad1632"

# Named environments do NOT inherit bindings/migrations, so the real-time DO is
# redeclared for the sandbox Worker.
[[env.sandbox.durable_objects.bindings]]
name = "REALTIME"
class_name = "RealtimeHub"

[[env.sandbox.migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeHub"]
