#:schema node_modules/wrangler/config-schema.json
name = "pesaswap-merchant-app"
main = "dist/server/server.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/client"

[vars]
# API base for server->PesaSwap calls (src/api/payments.ts). Production is live;
# NOT app.pesaswap.io (dashboard). Use https://api.sandbox.pesaswap.io for tests.
PESASWAP_URL = "https://api.pesaswap.io"

# Auth posture (config-as-code so it is version-controlled, not a floating
# secret). "0"/unset = open, scoped, NON-admin pilot session — demo login works
# and the back office can call protected endpoints. Set to "1" to force a real
# credentialed login (email+password / Google / staff PIN) for every operator.
# Kept "0" for the live pilot; flip to "1" here and redeploy to harden.
AUTH_REQUIRE_LOGIN = "0"

# Public origin for shareable links (pay links, QR, booking). Without this,
# links fall back to http://localhost:8080 and break for real customers/agents.
PUBLIC_BASE_URL = "https://pesaswap-merchant-app.pesaswap.workers.dev"

# Payments test mode. "1" simulates a SUCCESSFUL payment WITHOUT calling PesaSwap,
# so the full journey (QR -> order -> pay -> success -> loyalty -> receipt portal)
# can be tested end-to-end without live credentials. The ledger is still written
# (loyalty + settlement run). Set to "0" and add a real PESASWAP_API_KEY (secret)
# to take real M-Pesa payments.
PAYMENTS_TEST_MODE = "1"

# --- Cloudflare edge capabilities ---

# Workers AI: the natural-language ops agent + embeddings for pgvector memory.
# Enable for a real deploy. Workers AI runs on Cloudflare, so it is NOT available
# in offline `wrangler dev` — the agent falls back to rule-based SQL locally:
#   [ai]
#   binding = "AI"

# Hyperdrive: pooled, low-latency access to the PostgreSQL database from the
# edge. Postgres is the single source of truth. Provision with:
#   wrangler hyperdrive create pesaswap-db --connection-string="postgres://USER:PASS@HOST:5432/DB"
# then paste the returned id below. `wrangler dev` uses localConnectionString
# (override per-container with WRANGLER_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "37e129fb323e48f8b30c842852bfddd7"
localConnectionString = "postgres://pesaswap:pesaswap@localhost:5433/pesaswap"

# Secrets (set via `wrangler secret put`):
# - PESASWAP_API_KEY
# - PESASWAP_WEBHOOK_SECRET
# - WHATSAPP_BRIDGE_URL    (public Cloudflare-Tunnel URL of the local WhatsApp
#                           bridge, so the edge Worker can send via WhatsApp)
# - WHATSAPP_BRIDGE_TOKEN  (shared secret guarding the bridge; must match the
#                           bridge container's BRIDGE_TOKEN)
# - CRON_SECRET            (shared secret guarding the invoicing/run +
#                           sequences/run sweeps against anonymous callers)
