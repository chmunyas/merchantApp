<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Offline · PesaSwap</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #e2e8f0;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        text-align: center;
      }
      .badge {
        width: 64px;
        height: 64px;
        border-radius: 9999px;
        background: rgba(16, 185, 129, 0.15);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }
      .dot {
        width: 24px;
        height: 24px;
        border-radius: 9999px;
        border: 4px solid #10b981;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        color: #94a3b8;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      .retry {
        display: inline-block;
        text-decoration: none;
        border-radius: 12px;
        background: #10b981;
        color: #04170f;
        font-weight: 600;
        font-size: 14px;
        padding: 10px 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge"><div class="dot"></div></div>
      <h1>You're offline</h1>
      <p>
        PesaSwap can't reach the network right now. Cached information is
        read-only. Reconnect before changing business data or making a payment.
      </p>
      <a href="/" class="retry">Try again</a>
    </div>
  </body>
</html>
