name: pesaswap-merchant-prod

services:
  merchant-app-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        # Client publishable key is baked into the bundle at build time.
        # docker compose auto-substitutes these from the local .env file.
        VITE_PESASWAP_PUBLISHABLE_KEY: ${VITE_PESASWAP_PUBLISHABLE_KEY:-}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-}
    image: pesaswap-merchant-app:prod
    container_name: pesaswap-merchant-app-prod
    ports:
      - "8787:8787"
    environment:
      - WRANGLER_SEND_METRICS=false
      - APP_ENV=production
      - AUTH_REQUIRE_LOGIN=1
      - AUTH_OTP_DEBUG=0
      - ALLOW_SIMULATORS=0
      - PAYMENTS_TEST_MODE=0
      # Hyperdrive local connection -> the prod Postgres service (workerd path).
      - CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE=postgres://pesaswap:pesaswap@postgres:5432/pesaswap
    volumes:
      # Server secrets for the local Workers runtime. With nodejs_compat these
      # become process.env inside the Worker (PESASWAP_API_KEY, etc.).
      - ./.env:/app/.dev.vars:ro
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: pesaswap-postgres-prod
    environment:
      - POSTGRES_USER=pesaswap
      - POSTGRES_PASSWORD=pesaswap
      - POSTGRES_DB=pesaswap
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

volumes:
  pgdata-prod:
