name: pesaswap-merchant-dev

services:
  merchant-app:
    build: .
    image: pesaswap-merchant-app:local
    container_name: pesaswap-merchant-app
    ports:
      - "8080:8080"
    # Loads PESASWAP_* / VITE_* variables into the container. Create it with:
    #   Copy-Item .env.example .env   (PowerShell)   or   cp .env.example .env
    env_file:
      - .env
    environment:
      # Poll for file changes so hot-reload works across the Docker bind mount.
      - CHOKIDAR_USEPOLLING=true
      # Optional Baileys bridge (QR-login for a WhatsApp Business App number).
      - WHATSAPP_BRIDGE_URL=http://whatsapp-bridge:8090
      # Shared secret the app presents to the bridge's /send. Must match the
      # bridge's BRIDGE_TOKEN. Set WHATSAPP_BRIDGE_TOKEN in .env (see .env.example).
      - WHATSAPP_BRIDGE_TOKEN=${WHATSAPP_BRIDGE_TOKEN:-}
      # Shared secret guarding the cron sweeps (invoicing/run, sequences/run) so
      # only the bridge (which presents x-cron-secret) can fire them.
      - CRON_SECRET=${CRON_SECRET:-}
      # Simulate successful payments so the full journey is testable without live
      # PesaSwap creds. Set to 0 + a real PESASWAP_API_KEY for real payments.
      - PAYMENTS_TEST_MODE=1
      # Cloud backend (Postgres). In production this is a Hyperdrive binding.
      - DATABASE_URL=postgres://pesaswap:pesaswap@postgres:5432/pesaswap
    volumes:
      # Live-reload: mount the source, but keep the image's installed node_modules.
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
    restart: unless-stopped

  whatsapp-bridge:
    build: ./whatsapp-bridge
    image: pesaswap-whatsapp-bridge:local
    container_name: pesaswap-whatsapp-bridge
    environment:
      - DATABASE_URL=postgres://pesaswap:pesaswap@postgres:5432/pesaswap
      - APP_INBOUND_URL=http://merchant-app:8080/api/whatsapp/bridge/inbound
      - APP_BASE_URL=http://merchant-app:8080
      - BRIDGE_PORT=8090
      - BRIDGE_VENUE=main
      # Shared secret required on /send, /qr, /logout once the bridge is exposed
      # publicly (see the cloudflared service). Unset => open (internal-only).
      - BRIDGE_TOKEN=${WHATSAPP_BRIDGE_TOKEN:-}
      # Presented as x-cron-secret when calling the app's invoicing/run +
      # sequences/run sweeps (must match the app's CRON_SECRET).
      - CRON_SECRET=${CRON_SECRET:-}
    ports:
      - "8090:8090"
    depends_on:
      - postgres
    restart: unless-stopped

  # Public ingress so the DEPLOYED Cloudflare Worker can reach the local bridge.
  # Cloudflare Quick Tunnel -> a random https://<id>.trycloudflare.com URL, printed
  # in `docker logs pesaswap-cloudflared`. Opt-in (does not start by default):
  #   docker compose --profile tunnel up -d cloudflared
  # The bridge is guarded by BRIDGE_TOKEN, so the public URL still needs the secret.
  # Point the Worker at it: wrangler secret put WHATSAPP_BRIDGE_URL (the tunnel URL)
  # and WHATSAPP_BRIDGE_TOKEN (the same shared secret).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pesaswap-cloudflared
    command: tunnel --no-autoupdate --url http://whatsapp-bridge:8090
    profiles: ["tunnel"]
    depends_on:
      - whatsapp-bridge
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: pesaswap-postgres
    environment:
      - POSTGRES_USER=pesaswap
      - POSTGRES_PASSWORD=pesaswap
      - POSTGRES_DB=pesaswap
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

volumes:
  pgdata:
